<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="ZONE STUDIO — Photography & Creative Production" />
  <title>ZONE STUDIO</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-screen="home" aria-label="Zone Studio home">
        <span class="brand-mark">◎</span>
        <span><b>ZONE STUDIO</b><small>PHOTOGRAPHY & CREATIVE PRODUCTION</small></span>
      </button>
      <nav class="desktop-nav" aria-label="Website navigation">
        <button class="desktop-link active" data-screen="home">Home</button>
        <button class="desktop-link" data-screen="home">About</button>
        <button class="desktop-link" data-screen="services">Services⌄</button>
        <button class="desktop-link" data-screen="gallery">Portfolio</button>
        <button class="desktop-link" data-screen="services">Pricing</button>
        <button class="desktop-link" data-screen="book">Book</button>
        <button class="desktop-link" data-screen="gallery">Gallery</button>
        <button class="desktop-link" data-screen="profile">Contact</button>
      </nav>
      <div class="header-actions"><button class="header-login" data-action="login">Login</button><button class="header-register" data-action="register">Register</button><button class="avatar" id="profileShortcut" aria-label="Open profile">MW</button></div>
    </header>

    <main id="appMain" class="main-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-screen="home"><span>⌂</span><small>Home</small></button>
      <button class="nav-item" data-screen="services"><span>▦</span><small>Services</small></button>
      <button class="nav-item book-nav" data-screen="book"><span>＋</span><small>Book</small></button>
      <button class="nav-item" data-screen="gallery"><span>▧</span><small>Gallery</small></button>
      <button class="nav-item" data-screen="profile"><span>♙</span><small>Profile</small></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="api-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
